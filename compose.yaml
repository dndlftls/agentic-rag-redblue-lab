x-service-defaults: &service-defaults
  build:
    context: .
  runtime: runc
  restart: unless-stopped
  networks:
    - agent-network
  environment:
    APP_VERSION: ${APP_VERSION:-0.1.0}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-healthcheck: &healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    restart: unless-stopped
    networks:
      - agent-network
    ports:
      - "${HOST_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy

  ollama-embedding-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy

  orchestrator:
    <<: *service-defaults
    command:
      - uvicorn
      - services.orchestrator.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      RAG_CONTEXT_LIMIT: ${RAG_CONTEXT_LIMIT:-6}
      EXPERIMENT_RESULTS_DIR: /app/data/experiments
      EXPERIMENT_SCENARIOS_FILE: /app/datasets/experiments/nq_target_queries.json
      AGENT_MEMORY_FILE: /app/data/memory/memory.jsonl
      MEMORY_RECALL_LIMIT: ${MEMORY_RECALL_LIMIT:-3}
      LOCAL_DB_AGENT_URL: http://local-db-agent:8000
      GMAIL_AGENT_URL: http://gmail-agent:8000
      DRIVE_AGENT_URL: http://drive-agent:8000
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
    volumes:
      - experiment-results:/app/data/experiments
      - agent-memory:/app/data/memory
    healthcheck: *healthcheck

  local-db-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.local_db_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${LOCAL_DB_PORT:-8001}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: /app/datasets/generated/nq_100000.json
      SEARCH_BACKEND: chroma
      EMBEDDING_BACKEND: ollama
      OLLAMA_EMBEDDING_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_INDEX_BATCH_SIZE: 500
      CHROMA_COLLECTION: local-db-nomic-v1
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      RAGMASK_MASK_LENGTH: ${RAGMASK_MASK_LENGTH:-15}
      RAGMASK_DELTA: ${RAGMASK_DELTA:-0.05}
      RAGMASK_OVERFETCH: ${RAGMASK_OVERFETCH:-2}
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      CHROMA_SYNC_TRUSTED_CORPUS: "true"
    volumes:
      - local-db-chroma:/app/data/chroma
    depends_on:
      ollama-embedding-model-init:
        condition: service_completed_successfully
    healthcheck: *healthcheck

  gmail-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.gmail_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${GMAIL_PORT:-8002}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: ${GMAIL_DATA_FILE:-/app/datasets/sample/gmail_dummy.json}
      SEARCH_BACKEND: chroma
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      RAGMASK_MASK_LENGTH: ${RAGMASK_MASK_LENGTH:-15}
      RAGMASK_DELTA: ${RAGMASK_DELTA:-0.05}
      RAGMASK_OVERFETCH: ${RAGMASK_OVERFETCH:-2}
      CHROMA_COLLECTION: gmail
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      GMAIL_SYNC_ENABLED: ${GMAIL_SYNC_ENABLED:-false}
      GMAIL_QUERY: ${GMAIL_QUERY:-in:anywhere}
      GMAIL_MAX_MESSAGES: ${GMAIL_MAX_MESSAGES:-100}
      GOOGLE_GMAIL_TOKEN_FILE: /run/secrets/google-gmail-token.json
    volumes:
      - gmail-chroma:/app/data/chroma
    healthcheck: *healthcheck

  drive-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.drive_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${DRIVE_PORT:-8003}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: ${DRIVE_DATA_FILE:-/app/datasets/sample/drive_dummy.json}
      SEARCH_BACKEND: chroma
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      RAGMASK_MASK_LENGTH: ${RAGMASK_MASK_LENGTH:-15}
      RAGMASK_DELTA: ${RAGMASK_DELTA:-0.05}
      RAGMASK_OVERFETCH: ${RAGMASK_OVERFETCH:-2}
      CHROMA_COLLECTION: drive
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      DRIVE_SYNC_ENABLED: ${DRIVE_SYNC_ENABLED:-false}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - drive-chroma:/app/data/chroma
    healthcheck: *healthcheck

networks:
  agent-network:
    driver: bridge

volumes:
  local-db-chroma:
  gmail-chroma:
  drive-chroma:
  ollama-models:
  experiment-results:
  agent-memory:
